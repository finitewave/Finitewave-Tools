site_name: Finitewave-Tools
site_description: Tutorials for cardiac mesh preparation, visualization, and analysis.
site_url: https://finitewave.github.io/Finitewave-Tools/
repo_url: https://github.com/finitewave/Finitewave-Tools
repo_name: finitewave/Finitewave-Tools
docs_dir: pages
site_dir: site
use_directory_urls: true

hooks:
  - hooks/tutorials.py

watch:
  - ../Tutorials

nav:
  - Start here: index.md
  - Mesh:
      - Plotting and animation: Plot and Animation.ipynb
      - Left ventricle fibers: Left Ventricle Fibers.ipynb
  - Electrophysiology:
      - Alternans and spiral breakup: Alternans and Spiral Breakup.ipynb
      - Atrial tachycardia ablation: Atrial Tachycardia Ablation.ipynb
      - Phase mapping: Phase Mapping.ipynb
  - Electrograms:
      - Lead field electrograms: Lead Field Electrograms.ipynb
      - LAT-based electrograms: LAT based Electrograms.ipynb
  - Neural Networks:
      - LAT interpolation with PINN: LAT Interpolation with PINN.ipynb
      - Fiber estimation with PINN: Fiber Estimation with PINN.ipynb

  - Contributing tutorials: contributing.md

# Keep data and videos at their notebook-relative paths. Exclude unfinished
# notebooks until they contain publishable content.
exclude_docs: |
  /.ipynb_checkpoints/
  /Spiral Wave Core 2D.ipynb
  /Effect of Grid Spacing and Element Size.ipynb

theme:
  name: material
  custom_dir: overrides
  language: en
  font:
    text: false
    code: JetBrains Mono
  palette:
    scheme: default
    primary: teal
    accent: deep purple
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight

extra_css:
  - stylesheets/colorful.css
  - stylesheets/code.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

plugins:
  - search
  - mkdocs-jupyter:
      include: ['*.ipynb']
      ignore:
        - 'Spiral Wave Core 2D.ipynb'
        - 'Effect of Grid Spacing and Element Size.ipynb'
      execute: false
      include_source: true
      show_input: true
      ignore_h1_titles: true
      toc_depth: 3  # Section and subsection headings (H2/H3).

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      toc_depth: "2-3"
  - pymdownx.details
  - pymdownx.highlight:
      use_pygments: true
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
