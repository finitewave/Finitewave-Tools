[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "finitewave_tools"
version = "0.0.1"
description = "Tools for cardiac electrophysiology modeling with finite-difference methods."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [
  { name = "Arstanbek Okenov", email = "arstanbek.okenov@gmail.com" },
  { name = "Timur Nezlobinsky", email = "nezlobinsky@gmail.com" },
]
keywords = ["cardiac electrophysiology", "finite-difference methods", "simulation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]

dependencies = [
  "numpy==2.1.3",
  "scipy==1.16.3",
  "pyamg==5.3.0",
  "matplotlib==3.10.0",
  "tqdm==4.67.3",
  "natsort==8.4.0",
  "pyvista==0.49.1",
  "vtk==9.7.1",
  "av==18.1.0",
  "imageio==2.38.0",
  "scikit-image==0.25.2",
]

[project.urls]
Homepage = "https://github.com/finitewave/Finitewave-Tools"
Repository = "https://github.com/finitewave/Finitewave-Tools"
Issues = "https://github.com/finitewave/Finitewave-Tools/issues"

[project.optional-dependencies]
test = [
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
]
docs = [
  "mkdocs>=1.6.1,<2",
  "mkdocs-material>=9.7.7,<10",
  "pymdown-extensions>=12.1,<13",
  "mkdocs-jupyter>=0.26.3,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["finitewave_tools"]
